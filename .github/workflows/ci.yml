name: CI

# Runs lint, type-check, tests, and the version-policy check on every push and
# pull request. Any stage that fails causes the whole pipeline to report a
# failing status (Requirements 6.1, 6.2). No step uses continue-on-error, so
# non-zero exit codes are never swallowed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Lint, type-check, tests, version-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the runner Node version to the Active LTS line the project uses.
      # node-version-file reads .nvmrc so CI stays in lockstep with local dev.
      - name: Set up Node (Active LTS from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Deterministic install from the committed lockfile (pinned dependencies).
      - name: Install dependencies
        run: npm ci

      # Distinct stages. Each runs the existing package.json scripts (added in
      # task 1.1) so CI references real, working commands rather than
      # duplicating command logic. A failure in any stage fails the job.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Version-policy check
        run: npm run version-policy

  # The standalone dashboard SPA under web/ has its own lockfile, Node setup, and
  # scripts, so it is verified in a distinct job. This closes the previous gap
  # where the frontend had NO CI coverage and a broken SPA could merge to main.
  # type-check + production build (tsc --noEmit && vite build via `npm run build`)
  # and the Vitest unit/property suite all run; any failure fails the pipeline.
  web:
    name: Web SPA — build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (Active LTS from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build` — it both type-checks and
      # produces the static bundle, so a type error or a broken build fails here.
      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
