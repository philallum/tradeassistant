name: Deploy (scheduled daily-run Job + dashboard SPA)

# Delivery pipeline, triggered on every push to `main`. It deploys TWO
# independent, path-filtered targets so a backend-only or frontend-only change
# redeploys only what it touched:
#
#   1. BACKEND — the GCP-scheduled daily refresh (Requirement 16.7): run the
#      FULL quality gate (`npm run check`) and, only when green, build the
#      deterministic daily-run image via Cloud Build, push it to Artifact
#      Registry tagged with the commit SHA, and deploy that exact SHA-pinned
#      image to the Cloud Run Job. Pinning to the SHA extends the project's
#      determinism principle to ops: any prior commit's image can be redeployed
#      for an exact rollback.
#
#   2. FRONTEND — the read-only dashboard SPA (web/) to Firebase Hosting: build
#      the Vite bundle (which type-checks + tests ran in CI already) and
#      `firebase deploy --only hosting`. Gated on its own web build so a broken
#      SPA never reaches production.
#
# Authentication is KEYLESS for BOTH targets: CI authenticates to Google Cloud
# via Workload Identity Federation (OIDC) — no long-lived service-account key or
# FIREBASE_TOKEN is stored. The frontend deploy reuses the SAME WIF identity and
# passes the short-lived OAuth access token to firebase-tools. The Cloud Run Job
# itself runs as a dedicated least-privilege service account.
#
# Secrets (Supabase URL/keys + pooler URL, and the one external-signal provider
# API key the Job reads at runtime) are sourced at RUNTIME from Google Secret
# Manager via `--set-secrets`; they are never committed or baked into the image.
# Each `--set-secrets` entry maps a RUNTIME_ENV_NAME to a Secret Manager
# reference (`<secret-name>:latest`) — never a value. Non-secret config
# (project, region, model, target) is passed via `--set-env-vars`.
#
# simplify-to-cloud-minimal Req 6.6: the provider secrets that served the
# since-removed subsystems (news, news-calendar, yields — alpha-vantage,
# finnhub) are NO LONGER injected; no retained runtime module reads them.
#
# daily-candle-freshness-and-cleanup (2026-11-03): the OHLC feed providers
# twelve-data and massive ARE injected again. The daily Candle_Freshness_Stage's
# Provider_Fallback_Chain (FCS -> Twelve Data -> Massive) needs a RANGE-capable
# provider to close a multi-day Gap_Backfill; FCS is latest-only, so without
# Twelve Data / Massive a gap >1 trading day could never self-heal (this is the
# root cause of the Oct-8 stuck-candle incident). TWELVE_DATA_API_KEY and
# MASSIVE_API_KEY are therefore REQUIRED runtime secrets, not orphans — do NOT
# remove them in a future resource cleanup.
#
# ONE-TIME PREREQUISITE for the frontend deploy: the WIF-impersonated deploy
# service account (`DEPLOY_SERVICE_ACCOUNT`) needs the Firebase Hosting admin
# role to publish — grant `roles/firebasehosting.admin` on the project. Without
# it the `firebase deploy` step 403s; the backend jobs are unaffected.

on:
  push:
    branches: [main]

# Least-privilege token permissions. `id-token: write` is required for the OIDC
# token used by Workload Identity Federation; `contents: read` to check out.
permissions:
  contents: read
  id-token: write

# Non-secret configuration. GCP identifiers are safe to keep here as repository
# or environment variables; NO secret value is present in this file.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  # Artifact Registry Docker repository (created out of band).
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  # Cloud Run Job name and its dedicated least-privilege runtime service account.
  CLOUD_RUN_JOB: ${{ vars.CLOUD_RUN_JOB }}
  # The intraday 4H validation Job (same image, intradayMain entrypoint). Defaults to
  # the name the operator created it with, so no new repository variable is required.
  INTRADAY_CLOUD_RUN_JOB: ${{ vars.INTRADAY_CLOUD_RUN_JOB || 'intraday-validation-run' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
  # Workload Identity Federation provider + the deploy-time service account CI
  # impersonates (both non-secret resource names).
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
  # Non-secret runtime config for the Job (selected model id).
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  # Public_Read_Path (simplify-to-cloud-minimal R5.1/R5.2, Option A). Both are
  # NON-SECRET GitHub repository variables, referenced BY NAME only:
  #   - DASHBOARD_SNAPSHOT_BUCKET: the public-read GCS bucket the Cloud Run Job
  #     writes `dashboard.json` to (injected as the Job's runtime env var).
  #   - VITE_SNAPSHOT_URL: the bucket object's public URL the SPA fetches
  #     cross-origin (baked into the Vite bundle at build time), e.g.
  #     https://storage.googleapis.com/<bucket>/dashboard.json.
  # OUT-OF-BAND (operator) prerequisites, NOT done by this workflow: create the
  # public-read bucket, grant the runtime SA object write on it (e.g.
  # roles/storage.objectAdmin), set the bucket's public read + a CORS rule
  # allowing the Hosting origin, and set these two repo variables.
  DASHBOARD_SNAPSHOT_BUCKET: ${{ vars.DASHBOARD_SNAPSHOT_BUCKET }}
  VITE_SNAPSHOT_URL: ${{ vars.VITE_SNAPSHOT_URL }}

jobs:
  # Stage 0 — detect which part of the monorepo changed so each target deploys
  # ONLY when its own files changed. A frontend-only commit skips the Cloud Run
  # build/deploy; a backend-only commit skips the Firebase deploy. Workflow /
  # shared-root changes trigger both to stay safe.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'data/**'
              - 'scripts/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'web/**'
              - '.github/workflows/deploy.yml'

  # Stage 1 (backend) — the SAME full quality gate CI runs. Deployment depends on
  # it, so a red gate blocks the build/deploy entirely.
  quality-gate:
    name: Quality gate (npm run check)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (Active LTS from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs lint + type-check + tests via the existing package.json script.
      - name: Quality gate
        run: npm run check

      - name: Version-policy check
        run: npm run version-policy

  # Stage 2 (backend) — build, push (SHA-tagged), and deploy the SHA-pinned
  # image. Runs ONLY after the quality gate passes (`needs`).
  build-and-deploy:
    name: Build image and deploy Cloud Run Job
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth to Google Cloud via Workload Identity Federation (OIDC).
      # Impersonates the deploy service account; no key material is stored.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Fully-qualified, commit-SHA-tagged image reference in Artifact Registry.
      # The SHA tag is what makes deploys reproducible and rollbacks exact.
      - name: Compute image reference
        id: image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/scheduled-run:${GITHUB_SHA}"
          echo "uri=${IMAGE}" >> "$GITHUB_OUTPUT"

      # Build via Cloud Build and push the SHA-tagged image to Artifact Registry.
      # --default-buckets-behavior=regional-user-owned-bucket: by default
      # Cloud Build writes logs to a Google-managed default bucket the
      # WIF-federated deploy SA cannot access, which makes `gcloud builds
      # submit` exit non-zero (and fail this step) even when the build itself
      # SUCCEEDS. Routing logs to a regional bucket OWNED by this project (which
      # the deploy SA can access) removes that dependency so the command's exit
      # status reflects the real build result.
      - name: Build and push image (Cloud Build)
        run: |
          gcloud builds submit \
            --project "${GCP_PROJECT_ID}" \
            --tag "${{ steps.image.outputs.uri }}" \
            --default-buckets-behavior=regional-user-owned-bucket \
            .

      # Deploy the SHA-PINNED image to the Cloud Run Job. The Job runs as the
      # dedicated least-privilege runtime service account. Non-secret config via
      # --set-env-vars; runtime secrets via --set-secrets (Secret Manager),
      # never baked into the image. --set-secrets injects only the Secret_Keys
      # the retained Job actually reads at runtime — the Supabase
      # URL/key/publishable-key/pooler-url, the external-signal (FCS) provider
      # key, and the two OHLC range providers (Twelve Data + Massive) the
      # Candle_Freshness_Stage falls back to for a Gap_Backfill — each as a
      # `<secret-name>:latest` Secret Manager reference, so no value lives in
      # this file. SUPABASE_POOLER_URL routes over the IPv4-reachable
      # pooler/REST endpoint (Cloud Run has no IPv6 egress).
      #
      # Write credential (simplify-to-cloud-minimal Req 4.6): under the
      # public-data model the single Write_Credential is the `supabase-key`
      # Secret Manager secret, referenced here by NAME only and injected into
      # SUPABASE_HOSTED_KEY, which the Job's storage config resolves as its write
      # path. Per task 5.2a the write role was swapped from `pipeline_writer` to
      # `fx_writer`; that cutover is a secret rotation (a new `supabase-key` JWT
      # version), NOT a workflow edit, so the `supabase-key` reference is RETAINED
      # here unchanged. SUPABASE_PUBLISHABLE_KEY is the gateway `apikey` that
      # admits the request before PostgREST resolves the write role from the
      # Bearer JWT, so it is RETAINED. NO secret value appears in this file.
      # Public read is open; the write path is not publicly writable.
      #
      # simplify-to-cloud-minimal Req 6.6: the provider secrets for the removed
      # subsystems (alpha-vantage, finnhub, news, news-calendar) are REMOVED
      # from --set-secrets — no retained module reads them. The RLS/scoped-JWT
      # read-side security and the read-proxy are gone, so there is no
      # scoped-read secret, read-view, or read-proxy step here.
      #
      # daily-candle-freshness-and-cleanup (2026-11-03): twelve-data-api-key and
      # massive-api-key are RE-ADDED (TWELVE_DATA_API_KEY / MASSIVE_API_KEY).
      # They are NOT orphans — the daily Candle_Freshness_Stage's
      # Provider_Fallback_Chain (FCS -> Twelve Data -> Massive) needs a
      # range-capable provider to self-heal a multi-day candle gap (FCS is
      # latest-only). Do NOT remove them in a future cleanup.
      - name: Deploy SHA-pinned image to Cloud Run Job
        run: |
          gcloud run jobs deploy "${CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.uri }}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --set-env-vars "GCP_PROJECT_ID=${GCP_PROJECT_ID},GCP_REGION=${GCP_REGION},GEMINI_MODEL=${GEMINI_MODEL},GOOGLE_GENAI_USE_VERTEXAI=true,EXTERNAL_SIGNAL_PROVIDER=FCS,SUPABASE_TARGET=hosted,DASHBOARD_SNAPSHOT_BUCKET=${DASHBOARD_SNAPSHOT_BUCKET}" \
            --set-secrets "EXTERNAL_SIGNAL_API_KEY=external-signal-api-key:latest,TWELVE_DATA_API_KEY=twelve-data-api-key:latest,MASSIVE_API_KEY=massive-api-key:latest,SUPABASE_HOSTED_KEY=supabase-key:latest,SUPABASE_PUBLISHABLE_KEY=supabase-publishable-key:latest,SUPABASE_HOSTED_URL=supabase-url:latest,SUPABASE_POOLER_URL=supabase-pooler-url:latest"

      # intraday-validation (2026-11-06): the SEPARATE ~08:00-UK intraday 4H validation
      # Job runs the SAME SHA-pinned image with its entrypoint overridden to
      # `dist/scheduled-run/intradayMain.js`, so it must be redeployed on EVERY backend
      # deploy or it silently keeps running a stale image (that stale image once
      # overwrote the published snapshot). `gcloud run jobs deploy` creates-or-updates,
      # so the Job's full config lives in the repo. Same runtime SA; only the secrets the
      # intraday Job reads (Twelve Data key + Supabase). Secret Manager refs by NAME only.
      # It deliberately does NOT inject the daily-only secrets (FCS, Massive, Gemini).
      # The guard fails fast on an empty bucket: an EMPTY DASHBOARD_SNAPSHOT_BUCKET
      # silently turns the snapshot republish into a logged no-op.
      - name: Deploy SHA-pinned image to intraday validation Job
        run: |
          test -n "${DASHBOARD_SNAPSHOT_BUCKET}" || { echo "DASHBOARD_SNAPSHOT_BUCKET is empty" >&2; exit 1; }
          gcloud run jobs deploy "${INTRADAY_CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.uri }}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --command "node" \
            --args "dist/scheduled-run/intradayMain.js" \
            --set-env-vars "GCP_PROJECT_ID=${GCP_PROJECT_ID},GCP_REGION=${GCP_REGION},SUPABASE_TARGET=hosted,DASHBOARD_SNAPSHOT_BUCKET=${DASHBOARD_SNAPSHOT_BUCKET}" \
            --set-secrets "TWELVE_DATA_API_KEY=twelve-data-api-key:latest,SUPABASE_HOSTED_KEY=supabase-key:latest,SUPABASE_PUBLISHABLE_KEY=supabase-publishable-key:latest,SUPABASE_HOSTED_URL=supabase-url:latest,SUPABASE_POOLER_URL=supabase-pooler-url:latest"

  # Stage 1 (frontend) — build + test the dashboard SPA. This mirrors the `web`
  # CI job and gates the deploy below, so a broken SPA never reaches production.
  web-quality-gate:
    name: Web quality gate (build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (Active LTS from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build` — type-check + bundle.
      # VITE_SNAPSHOT_URL (non-secret repo var) is baked into the bundle so the
      # SPA fetches the snapshot from the public GCS bucket cross-origin
      # (simplify-to-cloud-minimal R5.1, Option A). Unset → the SPA falls back to
      # same-origin /dashboard.json, so dev/preview still work.
      - name: Build
        env:
          VITE_SNAPSHOT_URL: ${{ env.VITE_SNAPSHOT_URL }}
        run: npm run build

      - name: Tests
        run: npm run test

  # Stage 2 (frontend) — deploy the built SPA to Firebase Hosting, KEYLESSLY.
  # Reuses the same Workload Identity Federation identity as the backend job: the
  # auth step mints a short-lived OAuth access token for the deploy service
  # account, which firebase-tools consumes via FIREBASE_TOKEN. No long-lived
  # FIREBASE_TOKEN secret and no service-account key are stored. The deploy SA
  # needs `roles/firebasehosting.admin` (see the one-time prerequisite in the
  # workflow header).
  deploy-frontend:
    name: Deploy dashboard SPA to Firebase Hosting
    runs-on: ubuntu-latest
    needs: web-quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth; request an OAuth access token (not just the federated
      # token) so firebase-tools can authenticate non-interactively.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Node (Active LTS from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Rebuild the bundle on the deploy runner so dist/ reflects this exact
      # commit (the build is cheap and keeps the deploy self-contained).
      # VITE_SNAPSHOT_URL (non-secret repo var) is baked in here too so the
      # DEPLOYED bundle points the SPA at the public GCS snapshot URL
      # (simplify-to-cloud-minimal R5.1, Option A).
      - name: Build web bundle
        working-directory: web
        env:
          VITE_SNAPSHOT_URL: ${{ env.VITE_SNAPSHOT_URL }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      # Deploy only Hosting, from web/ (where firebase.json + .firebaserc live).
      # Keyless auth via Application Default Credentials: firebase-tools reads
      # GOOGLE_APPLICATION_CREDENTIALS (the WIF credentials file the auth step
      # wrote) — the non-deprecated path. `FIREBASE_TOKEN` is intentionally NOT
      # set: it is deprecated in firebase-tools and, since the auth step exports
      # ADC, unnecessary. No long-lived secret is stored. --non-interactive +
      # --force so no prompt blocks the unattended deploy.
      #
      # NOTE: the deploy service account (DEPLOY_SERVICE_ACCOUNT) must hold
      # `roles/firebasehosting.admin`, or this step 403s on the release call.
      - name: Deploy to Firebase Hosting
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          firebase deploy \
            --only hosting \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive \
            --force
